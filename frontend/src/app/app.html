<div class="container">
  <h1>Article Summarizer</h1>

  <p>Paste an article below and generate a summary.</p>

  <textarea 
    [(ngModel)]="article" 
    placeholder="Paste your article here...">
  </textarea>

  <button (click)="summarizeArticle()">
    Summarize
  </button>

  <h2>Summary</h2>

  <div class="summary">
    {{ summary }}
  </div>
</div>
